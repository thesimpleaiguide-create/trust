<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust: Build vs Break</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Compact layout styles to prevent scrolling in embeds */
        html, body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        body::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        body {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .draggable-card {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: none;
            user-select: none;
        }
        .draggable-card:active {
            cursor: grabbing;
        }
        .drop-zone {
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            min-height: 220px;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background: #eff6ff;
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
        }
        .font-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .touch-dragging {
            opacity: 0.9;
            pointer-events: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .select-none { user-select: none; }
    </style>
</head>
<body class="font-main p-2 md:p-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-[#1e293b] text-white p-4 rounded-t-2xl text-center shadow-xl border-b border-slate-700">
            <h1 class="text-lg md:text-xl font-bold mb-1">Drag each tile to where it belongs.</h1>
            <p class="text-slate-400 italic text-sm">Does this action <span class="text-white font-bold">build</span> trust or <span class="text-white font-bold">break</span> it?</p>
        </div>

        <!-- Main Board -->
        <div class="bg-white border-x border-b border-slate-200 rounded-b-2xl p-4 shadow-md">
            
            <!-- Active Card Area -->
            <div id="source-container" class="flex flex-col items-center mb-6">
                <div id="active-card-slot" class="w-full max-w-md h-40 flex items-center justify-center border-2 border-slate-100 rounded-2xl bg-slate-50/50 relative p-4">
                    <!-- Cards will be injected here -->
                </div>
                <div id="deck-counter" class="mt-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                    Tiles Remaining: <span id="cards-left">8</span>
                </div>
            </div>

            <!-- 2 Target Zones -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Breaks Trust -->
                <div id="zone-break" class="drop-zone p-4 rounded-2xl flex flex-col items-center text-center transition-all group" ondrop="handleDrop(event, 'break')" ondragover="allowDrop(event)" ondragleave="handleDragLeave(event)">
                    <div class="w-10 h-10 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </div>
                    <div class="text-slate-800 font-bold text-lg mb-1">Breaks Trust</div>
                    <div id="count-break" class="px-3 py-0.5 bg-slate-200 text-slate-600 rounded-full text-[10px] font-bold uppercase">0 Items</div>
                </div>

                <!-- Builds Trust -->
                <div id="zone-build" class="drop-zone p-4 rounded-2xl flex flex-col items-center text-center transition-all group" ondrop="handleDrop(event, 'build')" ondragover="allowDrop(event)" ondragleave="handleDragLeave(event)">
                    <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <div class="text-slate-800 font-bold text-lg mb-1">Builds Trust</div>
                    <div id="count-build" class="px-3 py-0.5 bg-slate-200 text-slate-600 rounded-full text-[10px] font-bold uppercase">0 Items</div>
                </div>
            </div>
        </div>

        <!-- Completion UI -->
        <div id="completion-ui" class="hidden mt-4 text-center p-6 bg-white border border-slate-200 rounded-2xl shadow-xl">
            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-1">Activity Complete</h2>
            <p class="text-slate-600 text-sm max-w-md mx-auto mb-4">Trust is built through consistent validation and destroyed by dismissal. Your choices shape the patient journey.</p>
            <button onclick="location.reload()" class="px-6 py-2 bg-[#1e293b] text-white font-bold rounded-xl hover:bg-slate-700 transition shadow-lg">
                Restart Exercise
            </button>
        </div>
    </div>

    <!-- Modal with Dynamic Heading -->
    <div id="feedback-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden transform transition-all select-none">
            <div class="p-8 md:p-10">
                <h3 id="modal-heading" class="text-xl font-black mb-6"></h3>
                
                <div id="modal-quote-box" class="bg-white border-l-4 p-5 rounded-r-xl">
                    <p id="modal-italic-text" class="text-slate-600 italic text-base leading-relaxed font-medium"></p>
                </div>

                <button onclick="closeModal()" class="mt-8 w-full py-3 bg-[#1e293b] text-white font-bold rounded-2xl hover:bg-slate-800 transition shadow-lg">
                    Next Action
                </button>
            </div>
        </div>
    </div>

    <script>
        const scenarios = [
            // Breaks Trust
            { 
                id: 1, 
                target: 'break', 
                text: "Reminding the patient of the practice policy before acknowledging how they feel.", 
                feedback: "I know it can feel safer to lean on policy when things get tense, but leading with the 'what' before acknowledging the 'who' can make patients feel processed rather than heard. In our training, we talk about responding to the need beneath the behavior. By acknowledging the feeling first, you create the pause needed for de-escalation. You're doing a great job reflecting on this balance, and that awareness will make your next interaction even stronger." 
            },
            { 
                id: 2, 
                target: 'break', 
                text: "Informing the patient that other patients are also waiting.", 
                feedback: "It's so tempting to explain the pressure the practice is under when you can see the waiting room filling up. While it’s factually true, the patient in front of you often hears this as their own distress being minimized. We want to move from being the judge of their time to the detective of their distress. Your willingness to look at how this lands shows real commitment to your role, and remember, when a patient feels seen, their defenses start to lower." 
            },
            { 
                id: 3, 
                target: 'break', 
                text: "Telling the patient to 'calm down'.", 
                feedback: "When someone is shouting, our natural instinct is to tell them to stop so we can finally help them. However, 'calm down' often feels like a command that challenges their autonomy, which can trigger more fight-or-flight. We’ve learned that a calm, steady voice of our own is the best biological signal of safety we can offer. Reflecting on these 'bait' moments is how we grow into skilled managers of conflict, and you’re building the tools to stay steady even when things get loud." 
            },
            { 
                id: 4, 
                target: 'break', 
                text: "Ignoring the underlying emotion.", 
                feedback: "I understand how easy it is to focus purely on logistics when you're busy, but ignoring the underlying emotion usually means we miss the real message the patient is sending. As we discussed, the emotion is often the condition, while the behavior is just the symptom. Your focus on catching these emotional cues is exactly what compassionate care is about. You're learning to hear what isn't being said, and that is a true professional skill." 
            },
            // Builds Trust
            { 
                id: 5, 
                target: 'build', 
                text: "Validating the patient's fear or frustration.", 
                feedback: "It’s wonderful to see you prioritizing validation; it truly is the heart of de-escalation. By acknowledging their fear, you’re telling the patient that they are safe and that you are an ally, not an opponent. This is Miller's Law in action—finding the world in which their distress makes sense. Your empathetic approach here is exactly what builds long-term trust in the practice, so keep trusting those instincts to connect before you correct." 
            },
            { 
                id: 6, 
                target: 'build', 
                text: "Inviting them to share more information.", 
                feedback: "I love how you’re using curiosity as a bridge here. Asking 'tell me more' shifts the dynamic from a conflict over a problem to a conversation between two people. This is the 'detective' mindset we strive for, looking for the hidden drivers behind the surface behavior. Your professionalism shines through when you invite the patient to feel found rather than just processed. This small shift in wording makes a massive difference in how care is delivered." 
            },
            { 
                id: 7, 
                target: 'build', 
                text: "Aligning with the patient against the problem.", 
                feedback: "Positioning yourself beside the patient is a powerful move that immediately changes the energy of an interaction. Instead of it being 'you vs. them,' it becomes 'us vs. the problem,' which is incredibly de-escalating. You're applying the core principle that we are only responsible for how we respond, and you’re responding with partnership. This level of reflection shows you're becoming a very steady hand at the front desk, and that partnership is where real solutions are found." 
            },
            { 
                id: 8, 
                target: 'build', 
                text: "Using an empathetic tone.", 
                feedback: "You've caught onto something vital—our tone communicates safety to a patient's nervous system before our words even register. Using an empathetic tone is a direct physiological intervention that can help move a patient out of fight-or-flight. It’s not always easy to maintain your calm when under pressure, so recognizing its value is a huge win. Your dedication to this 'human' element of your role is inspiring, and you're creating a welcoming environment, one interaction at a time." 
            }
        ];

        let currentDeck = [...scenarios].sort(() => Math.random() - 0.5);
        let counts = { break: 0, build: 0 };
        let activeCard = null;

        function renderNextCard() {
            const container = document.getElementById('active-card-slot');
            const counterLabel = document.getElementById('cards-left');
            container.innerHTML = '';
            counterLabel.innerText = currentDeck.length;
            
            if (currentDeck.length === 0) {
                container.innerHTML = '<div class="text-slate-400 font-medium">Activity Complete</div>';
                document.getElementById('deck-counter').classList.add('hidden');
                document.getElementById('completion-ui').classList.remove('hidden');
                return;
            }

            activeCard = currentDeck[0];
            const cardEl = document.createElement('div');
            cardEl.className = 'draggable-card w-full h-full bg-white shadow-xl border border-slate-200 rounded-2xl p-4 flex items-center justify-center text-center font-bold text-slate-800 text-base md:text-lg transition-all duration-300';
            cardEl.draggable = true;
            cardEl.innerText = activeCard.text;
            cardEl.id = "card-" + activeCard.id;
            
            cardEl.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', activeCard.id);
                cardEl.classList.add('opacity-40');
            });
            
            cardEl.addEventListener('dragend', (e) => {
                cardEl.classList.remove('opacity-40');
            });

            cardEl.addEventListener('touchstart', handleTouchStart, {passive: false});
            cardEl.addEventListener('touchmove', handleTouchMove, {passive: false});
            cardEl.addEventListener('touchend', handleTouchEnd, {passive: false});

            container.appendChild(cardEl);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(ev, zoneType) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            processChoice(zoneType);
        }

        function processChoice(zoneType) {
            if (zoneType === activeCard.target) {
                counts[zoneType]++;
                document.getElementById(`count-${zoneType}`).innerText = `${counts[zoneType]} Item${counts[zoneType] > 1 ? 's' : ''}`;
                showFeedback(activeCard, zoneType);
                currentDeck.shift();
                renderNextCard();
            } else {
                const slot = document.getElementById('active-card-slot');
                slot.classList.add('shake');
                setTimeout(() => slot.classList.remove('shake'), 400);
            }
        }

        function showFeedback(card, zoneType) {
            const heading = document.getElementById('modal-heading');
            const quoteBox = document.getElementById('modal-quote-box');

            document.getElementById('modal-italic-text').innerText = `"${card.feedback}"`;

            if (zoneType === 'build') {
                heading.innerText = "Builds Trust";
                heading.className = "text-xl font-black mb-6 text-green-600";
                quoteBox.className = "bg-white border-l-4 border-green-500 p-5 rounded-r-xl";
            } else {
                heading.innerText = "Breaks Trust";
                heading.className = "text-xl font-black mb-6 text-red-600";
                quoteBox.className = "bg-white border-l-4 border-red-500 p-5 rounded-r-xl";
            }

            document.getElementById('feedback-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
        }

        let touchStartX, touchStartY;
        function handleTouchStart(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            e.currentTarget.classList.add('touch-dragging');
        }
        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const card = e.currentTarget;
            card.style.position = 'fixed';
            card.style.width = '80vw';
            card.style.maxWidth = '300px';
            card.style.left = (touch.clientX - (parseInt(card.style.width)/2 || 150)) + 'px';
            card.style.top = (touch.clientY - 40) + 'px';
            card.style.zIndex = 1000;
        }
        function handleTouchEnd(e) {
            const card = e.currentTarget;
            const touch = e.changedTouches[0];
            const zones = ['break', 'build'];
            let dropped = false;

            card.classList.remove('touch-dragging');
            card.style.position = 'static';
            card.style.zIndex = 1;
            card.style.width = '100%';

            for(let z of zones) {
                const rect = document.getElementById(`zone-${z}`).getBoundingClientRect();
                if (touch.clientX > rect.left && touch.clientX < rect.right && touch.clientY > rect.top && touch.clientY < rect.bottom) {
                    processChoice(z);
                    dropped = true;
                    break;
                }
            }

            if (!dropped) renderNextCard(); 
        }

        window.onload = renderNextCard;
    </script>
</body>
</html>
